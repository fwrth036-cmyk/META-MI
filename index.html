<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>META MI - شحن فوري</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#0b0f1a;color:#fff;padding:16px}header{text-align:center;padding:20px 0}h1{font-size:28px;margin:0}h1 span{color:#00e5ff}.card{background:#141b2d;border:1px solid #222f4a;border-radius:16px;padding:16px;margin:12px 0}label{display:block;margin:12px 0 6px;color:#aab}select,input{width:100%;padding:14px;border-radius:12px;border:1px solid #2a375a;background:#0b1220;color:#fff;font-size:16px}button{width:100%;padding:16px;border:0;border-radius:14px;background:#00e5ff;color:#000;font-weight:800;font-size:18px;margin-top:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.opt{padding:14px;text-align:center;border:2px solid #2a375a;border-radius:12px;cursor:pointer}.opt.active{border-color:#00e5ff;background:#0e2a3a}.price{font-size:22px;font-weight:800;color:#00ff9d}#result{display:none;text-align:center;padding:20px}#code{font-size:32px;background:#000;padding:16px;border-radius:12px;border:2px dashed #00e5ff;margin:14px 0}</style></head><body>
<header><h1>META <span>MI</span></h1><p>شحن فوري - فودافون / أورانج / اتصالات / وي</p></header>
<div class="card"><label>الشبكة</label><div class="grid" id="nets"><div class="opt active" data-n="فودافون">فودافون</div><div class="opt" data-n="أورانج">أورانج</div><div class="opt" data-n="اتصالات">اتصالات</div><div class="opt" data-n="وي">وي</div></div>
<label>الباقة</label><select id="pkg"><option value="1 جيجا|30|25">1 جيجا - 30ج</option><option value="2 جيجا|55|45">2 جيجا - 55ج</option><option value="5 جيجا|110|95">5 جيجا - 110ج</option><option value="10 جيجا|190|170">10 جيجا - 190ج</option></select>
<label>رقم الموبايل</label><input id="phone" placeholder="01xxxxxxxxx">
<label>طريقة الدفع</label><div class="grid"><div class="opt active" data-m="vodafone_cash">فودافون كاش</div><div class="opt" data-m="card">كارت بنكي</div></div>
<div style="text-align:center;margin-top:12px">هتدفع: <span class="price" id="showPrice">30 جنيه</span></div>
<button id="pay">ادفع الآن</button></div>
<div class="card" id="result"><h3 id="status"></h3><div id="code"></div><p id="orderId"></p><button onclick="location.reload()">طلب جديد</button></div>
<script>
let net='فودافون', method='vodafone_cash';
document.querySelectorAll('#nets .opt').forEach(e=>e.onclick=()=>{document.querySelectorAll('#nets .opt').forEach(x=>x.classList.remove('active'));e.classList.add('active');net=e.dataset.n});
document.querySelectorAll('[data-m]').forEach(e=>e.onclick=()=>{document.querySelectorAll('[data-m]').forEach(x=>x.classList.remove('active'));e.classList.add('active');method=e.dataset.m});
let pkgEl=document.getElementById('pkg'); pkgEl.onchange=()=>{document.getElementById('showPrice').textContent=pkgEl.value.split('|')[1]+' جنيه'};
document.getElementById('pay').onclick=async()=>{
 let parts=pkgEl.value.split('|'); let phone=document.getElementById('phone').value.trim();
 if(phone.length<11){alert('اكتب رقم صحيح');return}
 let b=document.getElementById('pay'); b.disabled=true; b.textContent='جاري تحويلك للدفع...';
 let r=await fetch('/api/create-payment',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({net,pkg:parts[0],price:Number(parts[1]),buy:Number(parts[2]),phone,method})}).then(x=>x.json());
 if(!r.ok){alert(r.error||'خطأ');b.disabled=false;b.textContent='ادفع الآن';return}
 localStorage.setItem('lastOrder',r.order_id); location.href=r.payment_url;
};
async function check(){let id=new URLSearchParams(location.search).get('order')||localStorage.getItem('lastOrder'); if(!id) return; let r=await fetch('/api/check/'+id).then(x=>x.json()); if(r.ok && r.order.status!=='pending'){document.getElementById('result').style.display='block';document.getElementById('status').textContent=r.order.status==='used'?'✅ تم الدفع - كود الشحن': '❌ فشل الدفع';document.getElementById('code').textContent=r.order.code||'';document.getElementById('orderId').textContent='رقم الطلب: '+r.order.id;}}
check();
</script></body></html>
